name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # المشروع لا يحتوي Gradle Wrapper (لم يمكن توليده بدون إنترنت)، لذا نستخدم
      # setup-gradle الذي يثبّت نسخة Gradle المطلوبة. يفشل البناء عند أي خطأ ترجمة.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build
        run: gradle build --no-daemon

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: Ultras_clans
          path: build/libs/Ultras_clans-*.jar
