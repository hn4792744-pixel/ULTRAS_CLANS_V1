# ══════════════════════════════════════════════════════════════
#   Clan Tasks: Daily / Weekly / Monthly (قسم 31)
# ══════════════════════════════════════════════════════════════
#
# لكل فترة (daily/weekly/monthly) 10 قوالب (templates). كل يوم/أسبوع/شهر
# يُختار قالب واحد تلقائيًا وبشكل حتمي (نفس القالب لنفس اليوم دائمًا، بلا
# حاجة لتخزين "أي قالب نشط" في قاعدة البيانات):
#   اليوم 1 (منذ 1970-01-01) → القالب 1، اليوم 2 → القالب 2 ... اليوم 10 →
#   القالب 10، ثم يعود للقالب 1 في اليوم 11، وهكذا (قسم 31).
#
# أنواع المهام المتاحة (type):
#   KILL_PLAYERS      - قتل لاعبين (أي كلان)
#   KILL_MOBS          - قتل مخلوقات (mobs)
#   MINE_BLOCKS        - كسر كتل (أي نوع، وليس فقط الخامات المحسوبة لـCP)
#   PLACE_BLOCKS       - وضع كتل
#   PLAYTIME_MINUTES   - دقائق نشاط الكلان (أي عضو متصل = دقيقة واحدة للكلان)
#   MEMBERS_ONLINE     - أعلى عدد أعضاء متصلين معًا في نفس اللحظة خلال الفترة
#   BANK_DEPOSIT       - مبلغ يُودَع في بنك الكلان (تراكمي)
#
# reward-cp: كمية الـCP الممنوحة للكلان عند إكمال المهمة والمطالبة بها.

