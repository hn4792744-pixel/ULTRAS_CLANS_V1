# ══════════════════════════════════════════════════════════════
#   Clan Chat و Clan Tag (قسم 24-25-70)
# ══════════════════════════════════════════════════════════════

# هل يُضاف وسم الكلان قبل اسم اللاعب في الشات العام؟
# (يتعاون مع أي بلاجن شات آخر ولا يستبدل تنسيقه، بل يضيف الوسم في بدايته)
show-clan-in-chat: true

# تنسيق وسم الشات العام. المتغيرات: {clan_color} {clan}
tag-format: "&8[{clan_color}{clan}&8] &r"

# تنسيق رسائل Clan Chat الخاصة.
# المتغيرات: {clan_color} {clan} {player} {message}
clan-chat-format: "&8[&bCLAN&8] {clan_color}{clan} &8| &f{player}&8: &7{message}"
