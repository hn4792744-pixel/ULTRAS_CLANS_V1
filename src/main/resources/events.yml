# ══════════════════════════════════════════════════════════════
#   Clan Events / Clan Wars (قسم 32-43)
# ══════════════════════════════════════════════════════════════

# مدة صلاحية دعوة التحدي بالدقائق قبل أن تُحذف تلقائيًا
challenge-expiry-minutes: 30

# مدة التحضير بعد قبول الطرفين وقبل بدء العدّ التنازلي النهائي (ثواني)
preparation-seconds: 15

# فترة السماح (grace period) عند انقطاع اتصال لاعب أثناء الحدث (ثواني)
disconnect-grace-seconds: 300

# خيارات مدة الجولة المتاحة بالدقائق (يتم التنقل بينها بالنقر في GUI)
round-duration-options-minutes: [1, 5, 10, 15, 20, 25]

# الحد الأقصى لعدد الجولات القابل للاختيار
max-rounds: 15

# ------------------------------------------------------------
# Random Safe Location
# ------------------------------------------------------------
random-location:
  # نصف قطر البحث العشوائي من مركز العالم (أو من world-spawn)
  search-radius: 2000
  # محاولات البحث قبل الاستسلام
  max-attempts: 20

# ------------------------------------------------------------
# Admin Arena (قسم 34)
# ------------------------------------------------------------
admin-arena:
  # الحد الأقصى لحجم منطقة الاستعادة (بالكتل على كل محور) - حماية أداء
  max-region-size: 64
  # هل تُحذف الأغراض الساقطة (dropped items) داخل المنطقة عند إعادة الضبط؟
  clear-dropped-items-on-reset: true

# ------------------------------------------------------------
# المكافآت
# ------------------------------------------------------------
rewards:
  # هل تذهب أموال الرهان الفائزة إلى بنك الكلان مباشرة؟
  money-to-bank: true
