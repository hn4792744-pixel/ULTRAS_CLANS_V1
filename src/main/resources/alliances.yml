# مدة صلاحية دعوة التحالف بالدقائق قبل أن تُحذف تلقائيًا
invite-expiry-minutes: 60

# الحد الأقصى المطلق لعدد التحالفات لأي كلان (السعة الفعلية تبدأ من
# clan-defaults.alliance-capacity وتزيد بالترقيات، لكن لا تتجاوز هذا الرقم)
max-alliances: 5
