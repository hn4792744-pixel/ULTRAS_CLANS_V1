# ══════════════════════════════════════════════════════════════
#   U L T R A S   C L A N S   -   v1
#   Config عام للبلاجن
#   ملاحظة: هذا الملف يغطي المرحلة الأولى (Core) فقط.
#   الأنظمة القادمة (Bank, Storage, Warps, Events...) لها ملفات
#   Config منفصلة خاصة بها وستُفعّل تدريجيًا في المراحل القادمة.
# ══════════════════════════════════════════════════════════════

# لا تغيّر هذا الرقم يدويًا، يُستخدم داخليًا لترقية الـconfig تلقائيًا
# عند تحديث البلاجن دون فقدان تعديلاتك.
config-version: 1

# ------------------------------------------------------------
# اللغة
# ------------------------------------------------------------
# اللغة الافتراضية للبلاجن. القيم المتاحة: en / ar
# يحدد هذا الخيار من أي مجلد يتم تحميل ملفات messages/<lang>/
# يحتاج: /uc clan admin reload
language: ar

# ------------------------------------------------------------
# البادئة (Prefix)
# ------------------------------------------------------------
# تُستخدم في كل الرسائل خارج الشات (Title, ActionBar, BossBar, Books)
prefix-standalone: "ULTRAS |"

# تُستخدم داخل رسائل الشات العادية
prefix-chat: "&c&lULTRAS &8| &7"

# ------------------------------------------------------------
# المنطقة الزمنية
# ------------------------------------------------------------
# تُستخدم لتحديد بداية اليوم/الأسبوع/الشهر لمهام الكلان (قسم 68).
# مثال: Asia/Riyadh أو UTC أو Europe/London. اتركها فارغة لاستخدام
# منطقة السيرفر الزمنية الافتراضية.
timezone: ""

# ------------------------------------------------------------
# قاعدة البيانات
# ------------------------------------------------------------
database:
  # نوع قاعدة البيانات: SQLITE أو MYSQL
  # SQLITE لا يحتاج أي إعداد إضافي وهو الخيار الافتراضي والآمن.
  type: SQLITE

  # اسم ملف قاعدة بيانات SQLite (يوضع داخل مجلد البلاجن)
  sqlite-file: "data.db"

  mysql:
    host: "localhost"
    port: 3306
    database: "ultras_clans"
    username: "root"
    password: ""
    # معاملات إضافية تُضاف لرابط الاتصال (JDBC URL)
    parameters: "useSSL=false&autoReconnect=true&characterEncoding=utf8"

  # إعدادات Connection Pool (HikariCP)
  pool:
    maximum-pool-size: 10
    minimum-idle: 2
    connection-timeout-ms: 10000
    idle-timeout-ms: 600000
    max-lifetime-ms: 1800000

# ------------------------------------------------------------
# الاقتصاد (Vault)
# ------------------------------------------------------------
economy:
  # هل يُستخدم Vault للتعامل مع أموال اللاعبين؟
  # إذا false: تُعطّل كل الأنظمة التي تحتاج مال (إنشاء كلان بمقابل مادي، البنك...)
  enabled: true

  # الرمز الظاهر للاعب بجانب المبلغ
  currency-symbol: "$"

  # اسم العملة (يُستخدم في الرسائل والـplaceholders)
  currency-name: "Coins"

# ------------------------------------------------------------
# إنشاء الكلان (Create Clan)
# ------------------------------------------------------------
clan-creation:
  # سعر إنشاء كلان جديد (بعملة Vault)
  price: 1000.0

  # هل يُسترجع المبلغ تلقائيًا إذا فشلت عملية الإنشاء لأي سبب تقني؟
  refund-on-failure: true

  # فترة الانتظار (بالثواني) بين محاولات إنشاء كلان بعد فشل أو حذف كلان سابق
  cooldown-seconds: 60

  # قواعد اسم الكلان
  name:
    min-length: 3
    max-length: 16
    allow-arabic: true
    allow-english: true
    allow-numbers: true
    allow-symbols: false
    allow-spaces: false
    # هل أول حرف يجب أن يكون حرفًا (وليس رقمًا أو رمزًا)؟
    require-letter-first: true
    # قائمة الكلمات الممنوعة (case-insensitive)
    blacklisted-words:
      - "admin"
      - "owner"
      - "ultras"
      - "system"
      - "null"
    # أسماء محجوزة بالكامل ولا يمكن استخدامها أبدًا
    reserved-names:
      - "console"
      - "server"

# ------------------------------------------------------------
# القيم الافتراضية عند إنشاء كلان جديد
# ------------------------------------------------------------
clan-defaults:
  color: "WHITE"
  public: true
  member-capacity: 10
  max-member-capacity: 50
  bank-capacity: 50000.0
  storage-level: 1
  warp-capacity: 1
  alliance-capacity: 1

# ------------------------------------------------------------
# العضوية (Membership)
# ------------------------------------------------------------
membership:
  # مدة الاحتفاظ ببيانات العضو بعد مغادرته الكلان (بالأيام)
  # إذا عاد لنفس الكلان خلال هذه المدة تُسترجع بياناته بالكامل
  history-retention-days: 3

  # مدة الانتظار الإجبارية بعد مغادرة كلان قبل الانضمام لكلان آخر (بالدقائق)
  rejoin-cooldown-minutes: 10

# ------------------------------------------------------------
# الدعوات (Invites)
# ------------------------------------------------------------
invites:
  # مدة صلاحية الدعوة بالدقائق قبل أن تُحذف تلقائيًا
  expiry-minutes: 5

  # الحد الأقصى لعدد الدعوات المُرسلة المسموح بها في نفس الوقت لكل كلان
  max-pending-per-clan: 20

# ------------------------------------------------------------
# طلبات الانضمام (Join Requests)
# ------------------------------------------------------------
join-requests:
  expiry-minutes: 60
  max-pending-per-clan: 30
  # هل يُسمح للاعب بإرسال أكثر من طلب لنفس الكلان في نفس الوقت؟
  allow-duplicate-requests: false

# ------------------------------------------------------------
# الرتب الداخلية (Member Ranks) - راجع ranks.yml للتفاصيل الكاملة
# ------------------------------------------------------------
member-ranks:
  # الحد الأقصى لعدد الرتب القابلة للإنشاء داخل كل كلان
  max-ranks-per-clan: 14

  # هل يتطلب حذف رتبة نقرة تأكيد إضافية (Shift+Click ثم GUI تأكيد)؟
  require-double-confirmation-on-delete: true

# ------------------------------------------------------------
# الحماية والأمان
# ------------------------------------------------------------
security:
  # الحد الأدنى بالمللي ثانية بين نقرات GUI المتتالية لنفس اللاعب
  # (حماية أساسية من double-click / click-spam)
  gui-click-throttle-ms: 250

  # هل يتم تسجيل جميع عمليات GUI الحساسة في سجل التدقيق (audit log)؟
  audit-log-enabled: true

# ------------------------------------------------------------
# الأصوات
# ------------------------------------------------------------
sounds:
  enabled: true
  success: "ENTITY_PLAYER_LEVELUP"
  error: "ENTITY_VILLAGER_NO"
  click: "UI_BUTTON_CLICK"
  open: "BLOCK_CHEST_OPEN"
  close: "BLOCK_CHEST_CLOSE"
  invite: "ENTITY_EXPERIENCE_ORB_PICKUP"
  request: "BLOCK_NOTE_BLOCK_PLING"
  rankup: "ENTITY_PLAYER_LEVELUP"
  cp_gain: "ENTITY_EXPERIENCE_ORB_PICKUP"
  bank_deposit: "ENTITY_VILLAGER_YES"
  bank_withdraw: "ENTITY_VILLAGER_YES"
  upgrade: "BLOCK_ANVIL_USE"
  teleport_start: "BLOCK_PORTAL_TRIGGER"
  teleport_cancel: "ENTITY_VILLAGER_NO"
  teleport_success: "ENTITY_ENDERMAN_TELEPORT"

# ------------------------------------------------------------
# رسالة القتل (تُفعّل بالكامل في مرحلة لاحقة مع نظام CP)
# ------------------------------------------------------------
kill-message:
  # replace / append / disabled
  mode: "disabled"

# ------------------------------------------------------------
# السجلات (Audit Logs)
# ------------------------------------------------------------
logs:
  # عدد الأيام التي تُحفظ فيها السجلات قبل حذفها تلقائيًا (دوران السجلات).
  # 0 = لا حذف تلقائي. يُنفَّذ كل دقيقة ضمن مهمة التنظيف الدورية.
  retention-days: 28

# ------------------------------------------------------------
# PlaceholderAPI
# ------------------------------------------------------------
placeholders:
  # القيمة المُعادة للاعب بلا كلان (فارغة افتراضيًا)
  empty-value: ""

# ------------------------------------------------------------
# النسخ الاحتياطي التلقائي (SQLite فقط)
# ------------------------------------------------------------
backups:
  # نسخة يومية في plugins/Ultras_clans/backups/daily ونسخة أسبوعية (كل اثنين) في weekly
  enabled: true
  daily-keep: 7
  weekly-keep: 4
