# ══════════════════════════════════════════════════════════════
#   Warps / Spawn / TPA (قسم 22-23-26)
# ══════════════════════════════════════════════════════════════

# الحد الأقصى المطلق لعدد Warps لأي كلان (السعة الفعلية تبدأ من
# clan-defaults.warp-capacity وتزيد بالترقيات، لكن لا تتجاوز هذا الرقم)
max-warps: 5

# مدة العدّ التنازلي قبل الانتقال بالثواني (0 = فوري). يظهر فوق القلوب (ActionBar).
warp-delay-seconds: 5
spawn-delay-seconds: 3
tpa-delay-seconds: 3

# حماية من الضرر بعد الوصول بالثواني (قسم 23)
protection-seconds: 2

# نصف قطر البحث عن أقرب مكان آمن إذا كان الموقع المحفوظ خطرًا
safe-search-radius: 5

# عند موت عضو: هل يظهر مباشرة في Clan Spawn؟ (معطّل افتراضيًا - قسم 23)
respawn-at-clan-spawn: false

tpa:
  # فترة الانتظار بين إرسال طلب TPA وآخر لنفس اللاعب (ثواني)
  cooldown-seconds: 30
  # مدة صلاحية طلب TPA (ثواني)
  request-expiry-seconds: 60
